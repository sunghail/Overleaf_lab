name: overleaf-lab

services:
  sharelatex:
    image: overleaf-lab:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: server-ce/Dockerfile
      args:
        OVERLEAF_BASE_TAG: overleaf-lab-base:local
      labels:
        com.overleaf.ce.revision: ${OVERLEAF_LAB_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - overleaf-data:/var/lib/overleaf
      - ./.local/fonts:/usr/local/share/fonts/lab:ro
    environment:
      OVERLEAF_APP_NAME: Overleaf Community Edition
      OVERLEAF_SITE_URL: http://localhost:8080
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex?replicaSet=overleaf
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:?Run ./bin/lab init first}
      OVERLEAF_SESSION_SECRET: ${OVERLEAF_SESSION_SECRET:?Run ./bin/lab init first}
      EMAIL_CONFIRMATION_DISABLED: "true"
      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"
      ENABLE_PANDOC_CONVERSIONS: "true"
      SANDBOXED_COMPILES: "false"
      DOCKER_RUNNER: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/status"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "overleaf", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js:ro
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      - "mongo:127.0.0.1"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  redis:
    image: redis:6.2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  overleaf-data:
  mongo-data:
  redis-data:
